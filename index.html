function route(){
  const raw=(location.hash||"#home").slice(1);
  if(/access_token=|error_description=|type=recovery|type=signup/.test(raw)){return;} /* Supabase auth redirect: handled by auth listener */
  const h=decodeURIComponent(raw)||"home";const app=$("#app");let after=null;clearInterval(chatTimer);
  if(draft&&dirty&&$("#edBody")&&draft.status!=="published"){collect();clearTimeout(autosaveT);if(draft.title||words(draft.body)>2){saveDraftObj("draft",true);}dirty=false;}
  document.body.classList.remove("writer-mode");
  $("#mobileMenu").classList.remove("open");document.body.style.overflow="";
  if(h==="home"||h==="join"){app.innerHTML=viewHome();after=()=>afterHome(h==="join");}
  else if(h==="journal"){app.innerHTML=viewJournal();after=afterJournal;}
  else if(h==="members"){app.innerHTML=viewMembers();after=afterMembers;}
  else if(h.startsWith("members-")){app.innerHTML=viewMembers(h.slice(8));after=afterMembers;}
  else if(h==="about"){app.innerHTML=viewAbout();}
  else if(h==="signin"){if(me()){go("account");return;}app.innerHTML=viewSignin();after=afterSignin;}
  else if(h==="signup"){if(me()){go("inbox");return;}app.innerHTML=viewSignup();after=afterSignup;}
  else if(h==="admin"){app.innerHTML=viewAdmin();after=afterAdmin;}
  else if(h==="member-data"){if(!me()){afterLoginTarget="member-data";go("signin");return;}app.innerHTML=viewMemberForm();after=afterMemberForm;}
  else if(h==="feed"){app.innerHTML=viewFeed();after=afterFeed;}
  else if(h.startsWith("post-")&&getPost(h.slice(5))){const p=getPost(h.slice(5));app.innerHTML=viewPost(p);after=()=>afterPost(p);}
  else if(h==="inbox"){app.innerHTML=viewInbox();after=afterInbox;}
  else if(h.startsWith("chat-")&&DIVISIONS.some(d=>d.id===h.slice(5))){app.innerHTML=viewChat("div:"+h.slice(5));after=()=>afterChat("div:"+h.slice(5));}
  else if(h.startsWith("dm-")&&me()&&h.slice(3)!==sessionId&&getUser(h.slice(3))){const r=dmRoom(sessionId,h.slice(3));app.innerHTML=viewChat(r);after=()=>afterChat(r);}
  else if(h.startsWith("dm-")&&!me()){app.innerHTML=chatGate();}
  else if(h==="forgot"){app.innerHTML=viewForgot();after=afterForgot;}
  else if(h==="newpass"){if(!me()){go("signin");return;}app.innerHTML=viewNewpass();after=afterNewpass;}
  else if(h==="account"){if(!me()){afterLoginTarget="account";go("signin");return;}app.innerHTML=viewAccount();after=afterAccount;}
  else if(h==="write"){if(draft&&draft._for!=="new")draft=null;app.innerHTML=viewWrite(null);after=afterWrite;}
  else if(h.startsWith("edit-")){app.innerHTML=viewWrite(h.slice(5));after=afterWrite;}
  else if(h.startsWith("member-")){const u=getUser(h.slice(7));app.innerHTML=u?viewMember(u):viewHome();after=u?null:()=>afterHome(false);}
  else{const a=published().find(x=>x.id===h)||(me()&&allArticles().find(x=>x.id===h&&x.author===me().id));
    if(a){app.innerHTML=viewArticle(a);after=()=>afterArticle(a);}else{app.innerHTML=viewHome();after=()=>afterHome(false);}}
  document.body.classList.toggle("chat-mode",/^(chat|dm)-/.test(h)&&!!me());
  renderNav();renderAnnouncement();if(after)after();
  if(h!=="join"&&!h.startsWith("chat-")&&!h.startsWith("dm-"))window.scrollTo(0,0);
  refreshUnread();
  document.documentElement.style.setProperty("--hdr",($("#hdr").offsetHeight)+"px");}
window.addEventListener("hashchange",()=>{if(!location.hash.startsWith("#edit-")&&location.hash!=="#write")previewMode=false;route();});
$$(".lang").forEach(g=>g.onclick=e=>{const b=e.target.closest("[data-l]");if(!b||b.dataset.l===lang)return;
  if(draft&&!previewMode&&$("#edBody"))collect();lang=b.dataset.l;persist();route();});
$("#menuBtn").onclick=()=>{$("#mobileMenu").classList.add("open");document.body.style.overflow="hidden";};
$("#menuClose").onclick=()=>{$("#mobileMenu").classList.remove("open");document.body.style.overflow="";};
document.addEventListener("click",e=>{const a=e.target.closest("[data-login]");if(a)afterLoginTarget=a.dataset.login!=="1"?a.dataset.login:(location.hash||"#members").slice(1);});
$("#mobileMenu").addEventListener("click",e=>{if(e.target.closest("a"))setTimeout(()=>{$("#mobileMenu").classList.remove("open");document.body.style.overflow="";},0);});
setInterval(()=>{if(me()&&!document.hidden)refreshUnread();},45000);
window.addEventListener("beforeunload",e=>{if(draft&&dirty&&$("#edBody")){collect();if(!LIVE)saveDraftObj("draft",true);else{e.preventDefault();e.returnValue="";}}});
window.addEventListener("resize",()=>document.documentElement.style.setProperty("--hdr",($("#hdr").offsetHeight)+"px"));

/* boot */
renderNav();
if(LIVE){$("#app").innerHTML=`<div class="empty" style="padding:120px 20px">${esc(t("loading"))}</div>`;
  DB.init().catch(e=>toast(String(e.message||e),6000)).finally(()=>{
    if(/access_token=|type=recovery|type=signup/.test(location.hash)){history.replaceState(null,"",location.pathname+(recovering?"#newpass":"#home"));}
    route();});}
else{try{route();}catch(e){$("#app").innerHTML=`<div class="empty" style="padding:100px 20px">Something went wrong loading the page. Please refresh. <br><small>${esc(String(e&&e.message||e))}</small></div>`;console.error(e);}}
})();

</script>
</body>
</html>
