<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Buz Owners — Business Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F3EDE2; --ink:#2A2C31; --gold:#8C6A2E; --gold-l:#D4B47A; --card:#FBF8F3; --dark:#24262B;
  --muted:#6B6A66; --line:1.5px solid var(--ink); --r:22px;
  --serif:'Playfair Display', Georgia, serif; --script:'Pinyon Script', cursive; --sans:'Jost', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.6;min-height:100vh;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* swirl background */
.swirls{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.swirls path{fill:none;stroke:var(--ink);stroke-width:.8;opacity:.09}
.swirls path.g{stroke:var(--gold);opacity:.16}
#app,header,footer{position:relative;z-index:1}

.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
.narrow{max-width:720px}
.label{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.dark .label{color:var(--gold-l)}
.h-display{font-family:var(--serif);font-weight:400;line-height:1.08;letter-spacing:-.01em}
.h-display em{font-style:italic;font-weight:400}
.h-display strong{font-weight:700}
.script{font-family:var(--script);font-weight:400;line-height:1}
.muted{color:var(--muted)}
.rule{height:0;border-top:1px solid rgba(42,44,49,.25);margin:0}

/* logo */
.logo{position:relative;display:inline-block;padding-top:.5em;line-height:.95;font-size:26px;white-space:nowrap}
.logo .l-the{position:absolute;top:-.12em;left:-.08em;font-family:var(--script);font-size:1.15em;color:var(--gold);transform:rotate(-9deg);line-height:1}
.logo .l-main{font-family:var(--serif);font-weight:700;letter-spacing:-.015em;display:block}
.logo .l-main i{font-weight:400}
.logo .l-city{display:block;text-align:right;font-family:var(--script);font-size:.52em;color:var(--gold);margin-top:.05em;padding-right:.1em}
.dark .logo .l-the,.dark .logo .l-city{color:var(--gold-l)}

/* header */
.topstrip{border-bottom:1px solid rgba(42,44,49,.18);text-align:center;padding:8px 12px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:500}
.topstrip b{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0;text-transform:none;font-size:13px;color:var(--gold)}
header.site{position:sticky;top:0;z-index:20;background:rgba(243,237,226,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(42,44,49,.12)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:10px;padding-bottom:12px}
.nav-links{display:flex;gap:28px;align-items:center}
.nav-links a{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;padding:6px 0;border-bottom:1.5px solid transparent}
.nav-links a.on{border-color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:var(--line);border-radius:999px;overflow:hidden;font-size:10px;letter-spacing:.18em;font-weight:500}
.lang button{padding:6px 10px}
.lang button.on{background:var(--ink);color:var(--cream)}
.avatar-btn{width:38px;height:38px;border-radius:50%;border:var(--line);overflow:hidden;display:block}
.menu-btn{display:none;width:40px;height:40px;border:var(--line);border-radius:50%;place-items:center}
.menu-btn span{display:block;width:16px;height:1.5px;background:var(--ink);position:relative}
.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0;width:16px;height:1.5px;background:var(--ink)}
.menu-btn span::before{top:-5px}.menu-btn span::after{top:5px}
.mobile-menu{position:fixed;inset:0;z-index:50;background:var(--cream);display:none;flex-direction:column;padding:24px 24px 40px}
.mobile-menu.open{display:flex}
.mobile-menu .mm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.mobile-menu nav a{display:block;font-family:var(--serif);font-size:38px;line-height:1.25;padding:6px 0;border-bottom:1px solid rgba(42,44,49,.15)}
.mobile-menu nav a em{font-style:italic}
.mobile-menu .mm-foot{margin-top:auto;display:flex;flex-direction:column;gap:16px}
.close-x{width:40px;height:40px;border:var(--line);border-radius:50%;font-size:20px;line-height:1}
@media (max-width:520px){.topstrip{letter-spacing:.16em;font-size:9px}}
@media (max-width:900px){.nav-links{display:none}.menu-btn{display:grid}.nav .lang{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:14px;padding:5px 5px 5px 22px;border:var(--line);border-radius:999px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;background:transparent;transition:background .2s,color .2s;white-space:nowrap}
.btn .arr{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;flex:none;transition:transform .2s}
.btn .arr svg{width:14px;height:14px}
.btn:hover .arr{transform:rotate(-45deg)}
.btn.solid{background:var(--ink);color:var(--cream)}
.btn.solid .arr{background:var(--cream);color:var(--ink)}
.btn.plain{padding:10px 20px}
.dark .btn{border-color:var(--cream);color:var(--cream)}
.dark .btn .arr{background:var(--gold-l);color:var(--dark)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.link-u{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;border-bottom:1.5px solid var(--gold);padding-bottom:3px}
.small-btn{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;border:1px solid var(--ink);border-radius:999px;padding:6px 14px}
.small-btn.danger{border-color:#8a3b2e;color:#8a3b2e}

/* cards */
.card{background:var(--card);border:var(--line);border-radius:var(--r)}
.portrait{border-radius:50%;overflow:hidden;background:#ccc;flex:none;display:block}
.portrait svg,.portrait img{width:100%;height:100%;display:block;object-fit:cover}
.portrait img{filter:grayscale(1) contrast(1.05)}
.cover{border-radius:16px;overflow:hidden;background:#ddd;aspect-ratio:4/3}
.cover svg,.cover img{width:100%;height:100%;object-fit:cover;display:block}

section{padding:64px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(32px,6vw,48px)}

/* hero */
.hero{padding:56px 20px 40px;text-align:center}
.hero .logo{font-size:clamp(50px,14vw,118px)}
.hero .tag{font-family:var(--serif);font-style:italic;font-size:clamp(20px,4.5vw,30px);margin-top:18px}
.hero .sub{max-width:520px;margin:14px auto 30px;color:var(--muted);font-size:15px}
.hero .btn-row{justify-content:center}
.hero .pillars{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:40px}
.hero .pillars span{border:1px solid rgba(42,44,49,.4);border-radius:999px;padding:7px 16px;font-size:10px;letter-spacing:.3em;text-transform:uppercase}

/* article cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.acard{padding:10px 10px 20px;display:flex;flex-direction:column;gap:14px;transition:transform .25s}
.acard:hover{transform:translateY(-3px)}
.acard .meta-top{display:flex;justify-content:space-between;align-items:center;padding:0 8px}
.lang-tag{font-size:9px;letter-spacing:.2em;border:1px solid var(--ink);border-radius:999px;padding:2px 8px;font-weight:500}
.acard h3{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.2;padding:0 8px}
.acard p.ex{font-size:14.5px;color:var(--muted);padding:0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.byline{display:flex;align-items:center;gap:10px;padding:0 8px;margin-top:auto}
.byline .portrait{width:36px;height:36px}
.byline .nm{font-family:var(--script);font-size:22px;line-height:1}
.byline .info{font-size:11px;color:var(--muted);letter-spacing:.04em}

.featured{display:grid;grid-template-columns:1.15fr 1fr;gap:0;overflow:hidden;padding:12px}
.featured .cover{aspect-ratio:auto;min-height:340px;height:100%}
.featured .body{padding:28px 30px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.featured h3{font-size:clamp(30px,4.6vw,46px)}
.featured p{color:var(--muted)}
@media (max-width:760px){.featured{grid-template-columns:1fr}.featured .cover{min-height:0;aspect-ratio:4/3}.featured .body{padding:22px 10px 12px}}

/* dark */
.dark{background:var(--dark);color:var(--cream)}
.dark .muted{color:#b9b4aa}
.quotes{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}
.quote{scroll-snap-align:start;flex:0 0 min(86%,420px);border:1.5px solid rgba(243,237,226,.55);border-radius:var(--r);padding:30px 26px;display:flex;flex-direction:column;gap:22px}
.quote .q{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.45}
.quote .q::before{content:"\201C";display:block;font-size:54px;line-height:.6;color:var(--gold-l);font-style:normal;margin-bottom:10px}
.quote .who{display:flex;align-items:center;gap:12px;margin-top:auto}
.quote .who .portrait{width:44px;height:44px}
.quote .who .nm{font-family:var(--script);font-size:28px;color:var(--gold-l)}
.quote .who .biz{font-size:10px;letter-spacing:.2em;text-transform:uppercase}

/* join */
.join{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;padding:40px;align-items:center}
.join h2{font-size:clamp(34px,6vw,54px)}
.qrbox{justify-self:center;text-align:center}
.qrbox #qr{background:var(--card);padding:14px;border:var(--line);border-radius:18px;display:inline-block}
.qrbox #qr img,.qrbox #qr canvas{display:block}
@media (max-width:760px){.join{grid-template-columns:1fr;padding:30px 22px}.qrbox{display:none}}

/* journal */
.page-head{padding:48px 0 24px}
.page-head h1{font-size:clamp(40px,9vw,72px)}
.search{display:flex;align-items:center;gap:10px;border:var(--line);border-radius:999px;padding:4px 6px 4px 20px;background:var(--card);max-width:520px;margin-top:22px}
.search input{border:0;background:transparent;flex:1;padding:10px 0;outline:none;font-size:15px;min-width:0}
.search .arr{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ink);border-radius:999px;padding:8px 16px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;background:transparent}
.chip.on{background:var(--ink);color:var(--cream)}
.chip.sm{padding:6px 12px}
.filters2{display:flex;gap:8px;align-items:center;margin-top:6px}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:20px}

/* article */
.art-head{padding:44px 0 26px;text-align:center}
.art-head h1{font-size:clamp(36px,7.5vw,64px);margin:16px 0 26px}
.art-author{display:inline-flex;align-items:center;gap:14px;text-align:left}
.art-author .portrait{width:58px;height:58px}
.art-author .nm{font-family:var(--script);font-size:32px;line-height:1}
.art-author .biz{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;margin-top:4px}
.art-meta{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:18px}
.art-cover{max-width:1000px;margin:0 auto;border-radius:var(--r);overflow:hidden;border:var(--line);aspect-ratio:16/9;background:#ddd}
.art-cover svg,.art-cover img{width:100%;height:100%;object-fit:cover;display:block}
.prose{font-size:17.5px;line-height:1.8;font-weight:400;padding:44px 0 20px;overflow-wrap:break-word;hyphens:auto}
.prose > *+*{margin-top:1.15em}
.prose > p:first-child::first-letter{font-family:var(--serif);float:left;font-size:4.2em;line-height:.82;padding:.06em .1em 0 0;color:var(--gold)}
.prose h2{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.2;margin-top:1.6em}
.prose h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:23px;line-height:1.3;margin-top:1.4em}
.prose blockquote{font-family:var(--serif);font-style:italic;font-size:25px;line-height:1.45;border-left:1.5px solid var(--gold);padding:4px 0 4px 24px;margin:1.6em 0}
.prose img{border-radius:16px;border:var(--line);margin:1.6em auto;width:100%}
.prose strong,.prose b{font-weight:500}
.prose ul,.prose ol{padding-left:1.3em}
.author-card{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:26px;margin:30px 0 10px;align-items:center}
.author-card .portrait{width:96px;height:96px}
.author-card .nm{font-family:var(--script);font-size:38px;line-height:1;margin:6px 0 2px}
.author-card .biz{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
.author-card p{font-size:15px;color:var(--muted);margin:10px 0 14px}
@media (max-width:560px){.author-card{grid-template-columns:1fr;text-align:center}.author-card .portrait{margin:0 auto}.author-card .btn-row{justify-content:center}}
.share-row{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 0 0;flex-wrap:wrap}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:10px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;margin-bottom:6px;color:var(--gold)}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:var(--line);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.auth-card{max-width:460px;margin:40px auto;padding:34px 26px}
.auth-card h1{font-size:40px;margin:10px 0 22px}
.err{color:#8a3b2e;font-size:14px;min-height:1em}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;border-top:1px solid rgba(42,44,49,.25)}

/* editor */
.editor-wrap{padding:30px 0 80px}
.title-input{width:100%;border:0;background:transparent;font-family:var(--serif);font-size:clamp(32px,7vw,52px);line-height:1.1;outline:none;padding:8px 0;resize:none;overflow:hidden}
.title-input::placeholder{color:#a9a49b;font-style:italic}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.ed-grid{grid-template-columns:1fr}}
.cover-pick{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.cover-pick .cover{aspect-ratio:4/3;border:var(--line)}
@media (max-width:460px){.cover-pick{grid-template-columns:1fr}}
.toolbar{position:sticky;top:var(--hdr,64px);z-index:10;display:flex;gap:6px;flex-wrap:wrap;background:var(--card);border:var(--line);border-radius:999px;padding:6px;margin:22px 0 0}
.toolbar button{min-width:38px;height:36px;border-radius:999px;padding:0 10px;font-family:var(--serif);font-size:15px}
.toolbar button:hover,.toolbar button:active{background:var(--cream)}
.toolbar .sep{width:1px;background:rgba(42,44,49,.25);margin:6px 2px}
.ed-body{min-height:340px;background:var(--card);border:var(--line);border-radius:var(--r);padding:26px 22px;margin-top:12px;outline:none}
.ed-body:empty::before{content:attr(data-ph);color:#a9a49b;font-style:italic;font-family:var(--serif)}
.ed-body.prose{padding-top:26px}
.ed-body.prose > p:first-child::first-letter{float:none;font-size:inherit;color:inherit;padding:0;font-family:inherit;line-height:inherit}
.ed-actions{position:sticky;bottom:0;z-index:10;background:rgba(243,237,226,.96);border-top:1px solid rgba(42,44,49,.15);padding:12px 0;margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.preview-banner{background:var(--ink);color:var(--cream);text-align:center;padding:10px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;border-radius:999px;margin-top:20px}
.status{font-size:12px;color:var(--muted);margin-right:auto;align-self:center}

/* lists */
.mini-list{display:flex;flex-direction:column}
.mini{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(42,44,49,.18)}
.mini .cover{width:72px;aspect-ratio:1;border-radius:12px;flex:none}
.mini .t{font-family:var(--serif);font-size:18px;line-height:1.25}
.mini .s{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mini .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* profile */
.prof-head{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding:50px 0 30px}
.prof-head .portrait{width:170px;height:170px;border:var(--line)}
.prof-head .nm{font-family:var(--script);font-size:clamp(46px,10vw,72px);line-height:1}
.prof-head .biz{font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin-top:8px}
.prof-head p{color:var(--muted);max-width:560px;margin:14px 0 16px}
@media (max-width:640px){.prof-head{grid-template-columns:1fr;text-align:center}.prof-head .portrait{margin:0 auto;width:140px;height:140px}.prof-head p{margin-left:auto;margin-right:auto}.prof-head .btn-row{justify-content:center}}
.mcard{padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.mcard .portrait{width:110px;height:110px;margin-bottom:8px}
.mcard .nm{font-family:var(--script);font-size:34px;line-height:1}
.mcard .biz{font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.mcard .ct{font-size:12px;color:var(--muted)}

/* about */
.about-hero{padding:56px 0 30px}
.about-hero h1{font-size:clamp(40px,9vw,76px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.vm{padding:30px 26px}
.vm h2{font-size:34px;margin:10px 0 14px}
.vm ol{list-style:none;counter-reset:m}
.vm li{counter-increment:m;padding:12px 0 12px 44px;position:relative;border-top:1px solid rgba(42,44,49,.15)}
.vm li::before{content:"0" counter(m);position:absolute;left:0;top:12px;font-family:var(--serif);font-style:italic;color:var(--gold)}
.founder{display:grid;grid-template-columns:320px 1fr;gap:44px;align-items:center}
.founder .ph{aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;border:1.5px solid rgba(243,237,226,.6)}
.founder .ph svg{width:100%;height:100%;display:block}
.founder .nm{font-family:var(--script);font-size:clamp(52px,10vw,80px);color:var(--gold-l);line-height:1;margin:10px 0 4px}
.founder h2{font-size:clamp(30px,5vw,44px);margin-top:10px}
.founder p{color:#d8d2c6;margin-top:14px}
.founder .sig{font-family:var(--script);font-size:40px;color:var(--gold-l);margin-top:20px}
@media (max-width:760px){.founder{grid-template-columns:1fr}.founder .ph{max-width:280px}}

footer.site{background:var(--dark);color:var(--cream);padding:56px 0 30px}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px}
.foot .logo{font-size:40px}
.foot h4{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-l);font-weight:500;margin-bottom:12px}
.foot a:not(.logo){display:block;padding:4px 0;font-size:14px;color:#d8d2c6}
.foot .tagline{font-family:var(--serif);font-style:italic;margin-top:14px;color:#d8d2c6}
.foot-bottom{border-top:1px solid rgba(243,237,226,.18);margin-top:40px;padding-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;letter-spacing:.12em;color:#a9a49b}

.badge{display:inline-block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;border:1px solid var(--ink);border-radius:999px;padding:2px 8px;margin-left:4px;vertical-align:middle;font-family:var(--sans)}
.badge.gold{border-color:var(--gold);color:var(--gold)}.badge.red{border-color:#8a3b2e;color:#8a3b2e}
.adm-body{padding-top:16px}
.adm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.adm-stats{grid-template-columns:repeat(2,1fr)}}
.adm-stat{background:var(--card);border:var(--line);border-radius:18px;padding:16px;cursor:pointer}
.adm-stat .n{font-family:var(--serif);font-size:34px;line-height:1}.adm-stat .l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.adm-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.adm-search{flex:1;min-width:220px;margin-top:0}
.adm-row .t{font-size:17px}
.adm-row .s{text-transform:none;letter-spacing:.02em;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snip-2{font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.announce{background:var(--ink);color:var(--cream);position:relative;z-index:15}
.ann-in{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;font-size:14px}
.ann-in span{flex:1}.ann-in a{color:var(--gold-l);text-decoration:underline}
.ann-in button{color:var(--cream);font-size:20px;line-height:1;width:28px;height:28px;border-radius:50%;border:1px solid rgba(243,237,226,.4);flex:none}
.other-wrap{margin-top:10px}
.other-wrap input{width:100%;background:var(--card);border:var(--line);border-radius:14px;padding:11px 14px;font-size:16px;outline:none}
.photo-pick{display:flex;align-items:center;gap:16px}
.ph-btn{width:84px;height:84px;border:var(--line);display:grid;place-items:center;background:var(--card);cursor:pointer;padding:0}
.ph-plus{font-family:var(--serif);font-size:34px;color:var(--gold);line-height:1}
.field .ed-grid input{width:100%;background:var(--card);border:var(--line);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.mc-bio{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prof-ph{display:flex;flex-direction:column;align-items:center;gap:10px}
.prof-bio{font-family:var(--serif);font-size:18px;line-height:1.55;color:var(--ink)!important}
.chat-head .wa-btn{display:inline-block;margin-top:6px}
/* member data form */
.form-cta{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:24px 26px;margin-bottom:22px;border-color:var(--gold)}
.form-cta h3{font-size:clamp(24px,5vw,32px);margin:6px 0}
@media (max-width:640px){.form-cta{grid-template-columns:1fr}}
.mform{padding:26px 22px;display:flex;flex-direction:column;gap:6px}
.fq{padding:18px 0;border-bottom:1px solid rgba(42,44,49,.12);transition:background .3s}
.fq.missing{background:rgba(140,106,46,.1);border-radius:12px}
.fq-l{font-family:var(--serif);font-size:19px;line-height:1.35;margin-bottom:10px}
.req{color:#8a3b2e}
.fq input:not([type=radio]):not([type=checkbox]),.fq textarea{width:100%;background:var(--cream);border:var(--line);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.fq textarea{min-height:90px;resize:vertical}
.opt-grid{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;background:transparent;transition:background .15s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt.on{background:var(--ink);color:var(--cream)}
.fsum{padding:20px;margin-top:12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.bar{height:10px;background:rgba(42,44,49,.08);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:999px}
.bn{text-align:right;font-weight:500}.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt-ans{font-size:14px;border-left:2px solid var(--gold-l);padding:4px 0 4px 10px;margin-top:8px}
details.resp{margin-top:10px;padding:0}
details.resp summary{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none}
details.resp summary::-webkit-details-marker{display:none}
details.resp summary .t{font-size:17px;font-family:var(--serif)}details.resp summary .s{font-size:12.5px;color:var(--muted)}
details.resp dl{padding:0 18px 16px;display:grid;grid-template-columns:1fr;gap:2px}
details.resp dt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:10px}
details.resp dd{font-size:14.5px}
</style>

 {id:"before-you-invest",author:"u-rosmila",cat:"finance",lang:"en",date:"2026-11-18",cover:{seed:1},featured:true,

  excerpt:"Every owner I meet wants to grow. Few can tell me their real margin. Here is the simple routine I wish I had started on day one.",

   P("None of these is complicated. What matters is looking at them on the same day, every week, so that a bad trend shows up while it is still small.")+

/* sanitize rich text */
const OK={P:1,H2:1,H3:1,STRONG:1,EM:1,BLOCKQUOTE:1,BR:1,UL:1,OL:1,LI:1,IMG:1,FIGURE:1,FIGCAPTION:1,HR:1,A:1};
const MAP={B:"strong",I:"em",DIV:"p",H1:"h2",H4:"h3",H5:"h3",H6:"h3"};
const imgOk=src=>!!src&&(/^data:image\/(png|jpe?g|gif|webp);/.test(src)||src.startsWith(STORAGE_PREFIX));
const hrefOk=h=>!!h&&/^(https?:\/\/|mailto:)/i.test(h.trim());
function clean(html){const doc=new DOMParser().parseFromString("<body>"+(html||"")+"</body>","text/html");walk(doc.body);
  return doc.body.innerHTML.replace(/<p><\/p>/g,"").replace(/<figure><\/figure>/g,"").trim();}
function walk(node){for(const ch of [...node.childNodes]){if(ch.nodeType===3)continue;if(ch.nodeType!==1){ch.remove();continue;}
  let el=ch,tag=el.tagName.toUpperCase();
  if(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","SVG","TEMPLATE","FORM","BUTTON","INPUT","META","LINK"].includes(tag)){el.remove();continue;}
  if(MAP[tag]){const n=document.createElement(MAP[tag]);while(el.firstChild)n.appendChild(el.firstChild);el.replaceWith(n);el=n;tag=n.tagName;}
  if(!OK[tag]){walk(el);const f=document.createDocumentFragment();while(el.firstChild)f.appendChild(el.firstChild);el.replaceWith(f);continue;}
  const src=tag==="IMG"?el.getAttribute("src"):null, href=tag==="A"?el.getAttribute("href"):null;
  [...el.attributes].forEach(a=>el.removeAttribute(a.name));
  if(tag==="IMG"){if(imgOk(src))el.setAttribute("src",src);else{el.remove();continue;}}
  if(tag==="A"){if(hrefOk(href)){el.setAttribute("href",href.trim());el.setAttribute("target","_blank");el.setAttribute("rel","noopener nofollow");}else{walk(el);const f=document.createDocumentFragment();while(el.firstChild)f.appendChild(el.firstChild);el.replaceWith(f);continue;}}
  walk(el);}}

/* image picking & compression (preview mode keeps images smaller: they live in the browser) */
const IMG_W=LIVE?1600:1000, IMG_Q=LIVE?.82:.7;
function compressFile(f,maxW){return new Promise(res=>{if(!f||!/^image\//.test(f.type))return res(null);
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,(maxW||IMG_W)/im.width);const c=document.createElement("canvas");
    c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",IMG_Q));};
    im.onerror=()=>res(null);im.src=rd.result;};rd.onerror=()=>res(null);rd.readAsDataURL(f);});}
function pickFiles(multiple){return new Promise(res=>{const inp=$("#fileInput");inp.value="";inp.multiple=!!multiple;inp.onchange=()=>res([...inp.files]);inp.click();});}
async function pickImage(maxW){const fs=await pickFiles(false);return fs[0]?compressFile(fs[0],maxW):null;}
async function pickImages(max){const fs=(await pickFiles(true)).slice(0,max||50);const out=[];for(const f of fs){const d=await compressFile(f);if(d)out.push(d);}return out;}

const rp=(v,d)=>{try{return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:d||0,minimumFractionDigits:d||0}).format(v);}catch(e){return "Rp "+Math.round(v);}};
const MKT_ITEMS=[
  {k:"gold",en:"Gold · per gram",id:"Emas · per gram",sub:{en:"World spot price",id:"Harga spot dunia"}},
  {k:"usd",en:"US Dollar",id:"Dolar AS",sub:{en:"1 USD",id:"1 USD"}},
  {k:"sgd",en:"Singapore Dollar",id:"Dolar Singapura",sub:{en:"1 SGD",id:"1 SGD"}},
  {k:"cny",en:"Chinese Yuan",id:"Yuan China",sub:{en:"1 CNY",id:"1 CNY"}},
  {k:"eur",en:"Euro",id:"Euro",sub:{en:"1 EUR",id:"1 EUR"}},
  {k:"btc",en:"Bitcoin",id:"Bitcoin",sub:{en:"1 BTC",id:"1 BTC"}}];
async function fetchJSON(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json();}
async function loadMarket(){
  const cg="https://api.coingecko.com/api/v3/simple/price?ids=pax-gold,bitcoin&vs_currencies=idr&include_24hr_change=true&include_last_updated_at=true"+(CFG.COINGECKO_KEY?"&x_cg_demo_api_key="+encodeURIComponent(CFG.COINGECKO_KEY):"");
  const [a,b]=await Promise.allSettled([fetchJSON(cg),fetchJSON("https://open.er-api.com/v6/latest/USD")]);
  const items={};
  if(a.status==="fulfilled"){const g=a.value["pax-gold"],c=a.value.bitcoin;
    if(g&&g.idr)items.gold={v:g.idr/31.1034768,ch:g.idr_24h_change,at:(g.last_updated_at||0)*1000};
    if(c&&c.idr)items.btc={v:c.idr,ch:c.idr_24h_change,at:(c.last_updated_at||0)*1000};}
  if(b.status==="fulfilled"&&b.value&&b.value.result==="success"){const r=b.value.rates,idr=r.IDR,at=(b.value.time_last_update_unix||0)*1000;
    if(idr){items.usd={v:idr,at};if(r.SGD)items.sgd={v:idr/r.SGD,at};if(r.CNY)items.cny={v:idr/r.CNY,at};if(r.EUR)items.eur={v:idr/r.EUR,at};}}
  if(Object.keys(items).length){mkt={t:Date.now(),items:Object.assign({},(mkt&&mkt.items)||{},items)};mktFailed=false;try{localStorage.setItem(MKT_KEY,JSON.stringify(mkt));}catch(e){}}
  else mktFailed=true;
  renderMarket();}
function marketHTML(){return `<section class="wrap mkt-sec" id="mktSec"><div class="sec-head" style="margin-bottom:16px"><div><div class="label">${esc(lang==="id"?"Pasar hari ini":"Market today")}</div>
   <h2 class="h-display" style="margin-top:8px">${lang==="id"?"<em>Angka</em> <strong>hari ini</strong>":"<em>Today's</em> <strong>numbers</strong>"}</h2></div>
   <button class="small-btn" id="mktRefresh" type="button">${esc(lang==="id"?"Muat ulang":"Refresh")}</button></div>
   <div class="mkt-row" id="mktRow"></div><p class="mkt-note" id="mktNote"></p></section>`;}
function renderMarket(){const row=$("#mktRow");if(!row)return;const it=(mkt&&mkt.items)||{};
  row.innerHTML=MKT_ITEMS.map(m=>{const x=it[m.k];const ch=x&&typeof x.ch==="number"?x.ch:null;
    return `<div class="mkt-card"><div class="mk-l">${esc(m[lang]||m.en)}</div><div class="mk-v">${x?esc(rp(x.v)):"—"}</div>
     <div class="mk-s"><span>${esc(m.sub[lang]||m.sub.en)}</span>${ch!==null?`<span class="mk-ch ${ch>=0?"up":"down"}">${ch>=0?"▲":"▼"} ${Math.abs(ch).toFixed(2)}%</span>`:""}</div></div>`;}).join("");
  const when=mkt?new Date(mkt.t).toLocaleString(lang==="id"?"id-ID":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  const src=lang==="id"
    ?`Emas: harga spot dunia via PAX Gold (CoinGecko), belum termasuk premi Antam/toko. Kurs: <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates by ExchangeRate-API</a> (diperbarui harian). Bitcoin: CoinGecko.`
    :`Gold: world spot price via PAX Gold (CoinGecko) — Antam/retail prices are higher. FX: <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates by ExchangeRate-API</a> (daily). Bitcoin: CoinGecko.`;
  $("#mktNote").innerHTML=(mktFailed&&!mkt?`<b>${esc(lang==="id"?"Harga live akan tampil setelah website online.":"Live prices appear once the website is online.")}</b> `:"")+
    (mkt?`${esc(lang==="id"?"Diperbarui":"Updated")} ${esc(when)}${mktFailed?` (${esc(lang==="id"?"tidak bisa memuat terbaru":"couldn't refresh")})`:""} · ${esc(lang==="id"?"otomatis tiap 5 menit":"refreshes every 5 minutes")}. `:"")+src;}
function startMarket(){renderMarket();loadMarket();clearInterval(mktTimer);mktTimer=setInterval(()=>{if(!$("#mktRow")){clearInterval(mktTimer);return;}if(!document.hidden)loadMarket();},5*60*1000);
  const b=$("#mktRefresh");if(b)b.onclick=()=>{b.disabled=true;loadMarket().finally(()=>b.disabled=false);};}
function marketContext(){const it=(mkt&&mkt.items)||{};const parts=MKT_ITEMS.filter(m=>it[m.k]).map(m=>`${m.en}: ${rp(it[m.k].v)}${typeof it[m.k].ch==="number"?` (24h ${it[m.k].ch.toFixed(2)}%)`:""}`);
  return parts.length?`Latest market data shown on the site (${new Date(mkt.t).toISOString()}): ${parts.join("; ")}. Gold is world spot per gram, not Antam retail.`:"";}

function getSample(){if(!aiSampleP){aiSampleP=new Promise(res=>{try{if(window.claude&&typeof window.claude.use==="function"){const tm=setTimeout(()=>res(null),12000);
  Promise.resolve(window.claude.use("sample")).then(v=>{clearTimeout(tm);res(v||null);},()=>{clearTimeout(tm);res(null);});}else res(null);}catch(e){res(null);}});}return aiSampleP;}
const AI_SUGGEST={en:["How do I calculate my HPP (cost of goods)?","Promo ideas for a café this December","Do I need to register as PKP?","How should I price my services?"],
  id:["Cara menghitung HPP produk saya?","Ide promo akhir tahun untuk kafe","Apakah saya wajib daftar PKP?","Bagaimana menentukan harga jasa?"]};
function aiSystem(){return `You are the AI business assistant of The Buz Owners, a community of small and medium business owners in Indonesia (F&B, retail, fashion, wellness, services and more).
Answer in the same language the member writes in (Bahasa Indonesia or English). Be practical, warm and concise: short paragraphs or short bullet lists, concrete numbers and examples in Rupiah where useful.
For tax, legal or investment questions give general guidance only, say clearly that rules change and should be confirmed with a professional, and suggest they find a tax consultant, notary or finance expert in The Buz Owners member directory ("Find people").
Never invent current prices, laws or rates; if you are unsure, say so. ${marketContext()}`;}
function md(txt){let h=esc(txt);h=h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,"$1<em>$2</em>");
  const lines=h.split(/\n/);let out="",list=null;
  for(const l of lines){const ul=/^\s*[-•*]\s+(.*)/.exec(l),ol=/^\s*\d+[.)]\s+(.*)/.exec(l),hd=/^\s*#{1,4}\s+(.*)/.exec(l);
    if(ul||ol){const tg=ul?"ul":"ol";if(list!==tg){if(list)out+=`</${list}>`;out+=`<${tg}>`;list=tg;}out+=`<li>${(ul||ol)[1]}</li>`;continue;}
    if(list){out+=`</${list}>`;list=null;}
    if(hd)out+=`<p><strong>${hd[1]}</strong></p>`;else if(l.trim())out+=`<p>${l}</p>`;}
  if(list)out+=`</${list}>`;return out;}
function aiHTML(){if(!AI_ON)return "";

   <p class="muted">${esc(lang==="id"?"Pertanyaan bisnis apa saja — harga, HPP, marketing, operasional, dasar pajak. Jawab dalam Bahasa Indonesia atau English.":"Any business question — pricing, costs, marketing, operations, tax basics. Answers in English or Bahasa Indonesia.")}</p></div>
   <button class="small-btn hide" id="aiClear" type="button">${esc(lang==="id"?"Obrolan baru":"New chat")}</button></div>
   <div class="ai-log" id="aiLog"></div>
   <div class="ai-sugg" id="aiSugg">${AI_SUGGEST[lang].map(q=>`<button type="button" class="chip sm" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
   <form class="chat-box ai-box" id="aiForm"><textarea id="aiIn" rows="1" maxlength="3000" placeholder="${esc(lang==="id"?"Tulis pertanyaanmu…":"Ask a business question…")}" aria-label="AI"></textarea><button class="send" aria-label="${esc(t("send"))}">${ARROW}</button></form>
   <p class="ai-note">${esc(lang==="id"?"AI bisa keliru. Untuk pajak & hukum, pastikan ke ahlinya — cari di menu Cari orang.":"AI can make mistakes. For tax and legal matters, confirm with a professional — find one under Find people.")}</p></div></section>`;}
function renderAI(){const log=$("#aiLog");if(!log)return;
  log.innerHTML=aiMsgs.map((m,i)=>`<div class="ai-msg ${m.role}">${m.role==="assistant"?`<div class="ai-av">AI</div>`:""}<div class="ai-b">${m.role==="assistant"?(m.content?md(m.content):`<span class="typing"><i></i><i></i><i></i></span>`):esc(m.content).replace(/\n/g,"<br>")}</div></div>`).join("");
  log.classList.toggle("hide",!aiMsgs.length);$("#aiSugg").classList.toggle("hide",!!aiMsgs.length);$("#aiClear").classList.toggle("hide",!aiMsgs.length);
  log.scrollTop=log.scrollHeight;}
async function aiAsk(q){q=String(q||"").trim();if(!q||aiBusy)return;
  if(LIVE&&!me()){afterLoginTarget="home";toast(lang==="id"?"Gabung atau masuk untuk memakai asisten AI.":"Join or sign in to use the AI assistant.",3500);go("signup");return;}
  aiBusy=true;aiMsgs.push({role:"user",content:q});const ans={role:"assistant",content:""};aiMsgs.push(ans);renderAI();
  const hist=aiMsgs.slice(0,-1).slice(-12).map(m=>({role:m.role,content:m.content}));
  try{
    const sample=await getSample();
    if(sample){const msgs=hist.map((m,i)=>i===0?{role:"user",content:aiSystem()+"\n\n---\nMember's message:\n"+m.content}:m);
      const r=await sample(msgs,{cache:false,modelTier:"quick",onText:({text})=>{ans.content=text;renderAI();}});ans.content=r.text||ans.content;}
    else if(LIVE){const {data,error}=await sb.functions.invoke("ask-ai",{body:{messages:hist,context:marketContext(),lang}});
      if(error)throw new Error((data&&data.error)||error.message||"AI unavailable");if(data&&data.error)throw new Error(data.error);ans.content=(data&&data.reply)||"…";}
    else ans.content=lang==="id"?"Asisten AI aktif setelah website online dan terhubung ke Supabase (lihat panduan setup).":"The AI assistant switches on once the website is online and connected to Supabase (see the setup guide).";
  }catch(e){ans.content=(lang==="id"?"Maaf, asisten AI sedang tidak bisa dipakai. ":"Sorry, the AI assistant isn't available right now. ")+(e&&(e.message||e.code)?"("+(e.message||e.code)+")":"");}
  aiBusy=false;renderAI();}
function wireAI(){const f=$("#aiForm");if(!f)return;renderAI();const inp=$("#aiIn");
  const fit=()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px";};inp.oninput=fit;
  inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(hover:hover)").matches){e.preventDefault();f.requestSubmit();}};
  f.onsubmit=e=>{e.preventDefault();const q=inp.value;inp.value="";fit();aiAsk(q);};
  $("#aiSugg").onclick=e=>{const b=e.target.closest("[data-q]");if(b)aiAsk(b.dataset.q);};
  $("#aiClear").onclick=()=>{if(aiBusy)return;aiMsgs=[];renderAI();};}

function dirMatch(u,skip){const q=dFilter.q.trim().toLowerCase(),c=normLoc(u.city),a=normLoc(u.area);
  if(skip!=="city"&&dFilter.city&&c!==dFilter.city)return false;
  if(skip!=="area"&&dFilter.area&&a!==dFilter.area)return false;
  if(skip!=="div"&&dFilter.div!=="all"&&!(u.divisions||[]).includes(dFilter.div))return false;
  return !q||q.split(/\s+/).every(w=>[u.name,u.business,u.role,u.services,u.bio,u.ig,u.city,u.area,u.other_field,(u.divisions||[]).map(divHay).join(" ")].join(" ").toLowerCase().includes(w));}
function renderDir(){const U=Object.values(users()),pub=published();
  // city & area options (counts respect the other filters)
  const cc={};U.filter(u=>dirMatch(u,"city")).forEach(u=>{const c=normLoc(u.city);if(c)cc[c]=(cc[c]||0)+1;});
  if(dFilter.city&&!cc[dFilter.city])cc[dFilter.city]=0;
  $("#fCity").innerHTML=`<option value="">${esc(t("all_cities"))}</option>`+Object.keys(cc).sort((a,b)=>cc[b]-cc[a]||a.localeCompare(b)).map(c=>`<option value="${esc(c)}" ${dFilter.city===c?"selected":""}>${esc(c)} (${cc[c]})</option>`).join("");
  const ac={};U.filter(u=>dirMatch(u,"area")).forEach(u=>{const a=normLoc(u.area);if(a)ac[a]=(ac[a]||0)+1;});
  if(dFilter.area&&!ac[dFilter.area])ac[dFilter.area]=0;
  $("#fArea").innerHTML=`<option value="">${esc(t("all_areas"))}</option>`+Object.keys(ac).sort().map(a=>`<option value="${esc(a)}" ${dFilter.area===a?"selected":""}>${esc(a)} (${ac[a]})</option>`).join("");
  $("#fArea").disabled=!Object.keys(ac).length;
  // field chips (counts respect location + search)
  const dc={};U.filter(u=>dirMatch(u,"div")).forEach(u=>(u.divisions||[]).forEach(d=>dc[d]=(dc[d]||0)+1));
  $("#divChips").innerHTML=`<button class="chip ${dFilter.div==="all"?"on":""}" data-d="all">${esc(t("all_fields"))}</button>`+
    DIVISIONS.filter(d=>dc[d.id]||dFilter.div===d.id).map(d=>`<button class="chip ${dFilter.div===d.id?"on":""}" data-d="${d.id}">${esc(divName(d.id))} <span class="ct-n">${dc[d.id]||0}</span></button>`).join("");
  const list=U.filter(u=>dirMatch(u)).map(u=>({u,n:pub.filter(a=>a.author===u.id).length})).sort((a,b)=>b.n-a.n||String(a.u.name).localeCompare(b.u.name));
  $("#dirGrid").innerHTML=list.length?list.map(({u,n})=>memberCard(u,n)).join(""):`<div class="empty" style="grid-column:1/-1">${esc(t("no_members"))}</div>`;
  const filtered=dFilter.q||dFilter.city||dFilter.area||dFilter.div!=="all";
  $("#dirCount").textContent=(list.length===1&&lang==="en")?"1 member found":t("result_n").replace("{n}",list.length);$("#clearF").classList.toggle("hide",!filtered);
  const g=(CFG.DIVISION_GROUPS||{})[dFilter.div],d=dFilter.div;
  $("#divGroup").innerHTML=d==="all"?"":`<div class="btn-row" style="margin-top:16px"><a class="btn solid" href="#chat-${esc(d)}">${esc(t("ask_room").replace("{d}",divName(d)))}<span class="arr">${ARROW}</span></a>${g?`<a class="btn" href="${esc(g)}" target="_blank" rel="noopener">${esc(t("div_chat").replace("{d}",divName(d)))}<span class="arr">${ARROW}</span></a>`:""}</div>`;}
function afterMembers(){renderDir();
  $("#dirForm").onsubmit=e=>{e.preventDefault();$("#dirIn").blur();};
  $("#dirIn").oninput=e=>{dFilter.q=e.target.value;renderDir();};
  $("#fCity").onchange=e=>{dFilter.city=e.target.value;dFilter.area="";renderDir();};
  $("#fArea").onchange=e=>{dFilter.area=e.target.value;renderDir();};

function inputDialog(title,ph){return new Promise(res=>{const bg=$("#modalBg");
  $("#modal").innerHTML=`<h3>${esc(title)}</h3><form id="dlgF"><div class="field"><input id="dlgIn" type="url" placeholder="${esc(ph)}" autocapitalize="none"></div>
   <div class="btn-row"><button type="button" class="small-btn" data-r="0">${esc(t("cancel"))}</button><button class="small-btn solid">${esc(title)}</button></div></form>`;
  bg.classList.add("open");setTimeout(()=>$("#dlgIn").focus(),50);
  $("#dlgF").onsubmit=e=>{e.preventDefault();const v=$("#dlgIn").value.trim();bg.classList.remove("open");res(v);};
  bg.onclick=e=>{if(e.target===bg||e.target.closest("[data-r]")){bg.classList.remove("open");res("");}};});}
function afterWrite(){if(!me())return;document.body.classList.add("writer-mode");
  const pub=$("#pubBtn");pub.onclick=doPublish;
  if(previewMode){$("#backEdit").onclick=()=>{previewMode=false;route();};return;}
  $("#prevBtn").onclick=()=>{collect();previewMode=true;route();window.scrollTo(0,0);};
  const body=$("#edBody"),ti=$("#edTitle"),su=$("#edSub");
  try{document.execCommand("defaultParagraphSeparator",false,"p");}catch(e){}
  if(!body.innerHTML.trim())body.innerHTML="<p><br></p>";
  body.addEventListener("focus",()=>{if(!body.innerHTML.trim()||body.innerHTML==="<br>")body.innerHTML="<p><br></p>";});
  const fit=el=>{el.style.height="auto";el.style.height=el.scrollHeight+"px";};[ti,su].forEach(el=>{fit(el);el.addEventListener("input",()=>{fit(el);scheduleAutosave();});});
  ti.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();su.focus();}});
  su.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();body.focus();}});
  edStatus(draft.updated?t("last_saved"):"");
  let saved=null;const keep=()=>{const s=getSelection();if(s.rangeCount&&body.contains(s.anchorNode))saved=s.getRangeAt(0).cloneRange();};
  ["keyup","mouseup","input","touchend","focus"].forEach(ev=>body.addEventListener(ev,keep));document.addEventListener("selectionchange",keep);
  body.addEventListener("input",scheduleAutosave);
  const restore=()=>{body.focus();if(saved){const s=getSelection();s.removeAllRanges();s.addRange(saved);}};
  const ensureP=()=>{if(!body.innerHTML.trim()){body.innerHTML="<p><br></p>";const r=document.createRange();r.setStart(body.firstChild,0);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);saved=r.cloneRange();}};
  async function insertImages(dataUrls){if(!dataUrls.length)return;
    for(let i=0;i<dataUrls.length;i++){if(dataUrls.length>1||LIVE)toast(t("uploading_n").replace("{i}",i+1).replace("{n}",dataUrls.length),4000);
      const url=await DB.uploadImage(dataUrls[i],"img");if(!url)continue;restore();
      document.execCommand("insertHTML",false,`<figure><img src="${esc(url)}" alt=""><figcaption data-ph="${esc(t("caption_ph"))}"></figcaption></figure><p><br></p>`);keep();}
    $$("figcaption",body).forEach(fc=>fc.setAttribute("data-ph",t("caption_ph")));scheduleAutosave();}
  body.addEventListener("paste",async e=>{const cd=e.clipboardData||window.clipboardData;const files=[...(cd.files||[])].filter(f=>/^image\//.test(f.type));
    e.preventDefault();
    if(files.length){keep();const ds=[];for(const f of files){const d=await compressFile(f);if(d)ds.push(d);}insertImages(ds);return;}
    const html=cd.getData("text/html");
    if(html){document.execCommand("insertHTML",false,clean(html));}
    else{const tx=cd.getData("text/plain");document.execCommand("insertHTML",false,tx.split(/\n{2,}/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join(""));}
    scheduleAutosave();});
  body.addEventListener("dragover",e=>{if([...(e.dataTransfer.items||[])].some(i=>i.kind==="file"))e.preventDefault();});
  body.addEventListener("drop",async e=>{const files=[...(e.dataTransfer.files||[])].filter(f=>/^image\//.test(f.type));if(!files.length)return;e.preventDefault();
    if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(e.clientX,e.clientY);if(r){saved=r;}}
    const ds=[];for(const f of files){const d=await compressFile(f);if(d)ds.push(d);}insertImages(ds);});
  $$("figcaption",body).forEach(fc=>fc.setAttribute("data-ph",t("caption_ph")));
  const tb=$("#tb");tb.addEventListener("mousedown",e=>{if(e.target.closest("button"))e.preventDefault();});
  tb.onclick=async e=>{const b=e.target.closest("[data-cmd]");if(!b)return;const c=b.dataset.cmd;
    if(c==="img"){keep();const ds=await pickImages(30);insertImages(ds);return;}
    if(c==="link"){keep();const sel=saved&&saved.toString();const url=await inputDialog(t("add_link"),t("link_ph"));if(!url)return;const u=/^https?:\/\//i.test(url)?url:"https://"+url;
      restore();if(sel)document.execCommand("createLink",false,u);else document.execCommand("insertHTML",false,`<a href="${esc(u)}">${esc(url)}</a>&nbsp;`);scheduleAutosave();return;}
    restore();ensureP();
    if(c==="bold"||c==="italic")document.execCommand(c);
    else if(c==="h2"||c==="h3"){const cur=document.queryCommandValue("formatBlock").toLowerCase();document.execCommand("formatBlock",false,cur===c?"<p>":"<"+c+">");}
    else if(c==="quote"){const cur=document.queryCommandValue("formatBlock").toLowerCase();document.execCommand("formatBlock",false,cur==="blockquote"?"<p>":"<blockquote>");}
    else if(c==="ul")document.execCommand("insertUnorderedList");
    else if(c==="ol")document.execCommand("insertOrderedList");
    else if(c==="hr")document.execCommand("insertHTML",false,"<hr><p><br></p>");
    keep();scheduleAutosave();};
  if(window.visualViewport){const vv=window.visualViewport;const place=()=>{if(!$("#tb"))return;const off=window.innerHeight-(vv.height+vv.offsetTop);$("#tb").style.bottom=(Math.max(0,off)+12)+"px";};
    vv.addEventListener("resize",place);vv.addEventListener("scroll",place);place();}
  if(!draft.title)setTimeout(()=>ti.focus(),50);}

/* ================= feed (Twitter-style notes, reposts, quotes, replies) ================= */
const IC={
  reply:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
  repost:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 7h10a3 3 0 0 1 3 3v2M17 17H7a3 3 0 0 1-3-3v-2"/><path d="M17 4l3 3-3 3M7 20l-3-3 3-3"/></svg>`,
  like:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`,
  share:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/></svg>`
};
function fmtRel(iso){const d=new Date(iso),s=(Date.now()-d.getTime())/1000;if(isNaN(s))return "";
  if(s<60)return lang==="id"?"baru saja":"now";if(s<3600)return Math.floor(s/60)+(lang==="id"?" mnt":"m");if(s<86400)return Math.floor(s/3600)+(lang==="id"?" jam":"h");
  if(s<604800)return Math.floor(s/86400)+(lang==="id"?" hr":"d");return d.toLocaleDateString(lang==="id"?"id-ID":"en-GB",{day:"numeric",month:"short"});}
const linkify=txt=>esc(txt).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g,'<a href="$1" target="_blank" rel="noopener nofollow">$1</a>').replace(/\n/g,"<br>");
function stats(kind,id){const L=allLikes(),Rp=allReposts(),P=allPosts();const k=x=>x.kind===kind&&x.target_id===id;
  return {likes:L.filter(k).length,liked:!!sessionId&&L.some(x=>k(x)&&x.user_id===sessionId),reposts:Rp.filter(k).length+P.filter(p=>p.quote_kind===kind&&p.quote_id===id).length,
    reposted:!!sessionId&&Rp.some(x=>k(x)&&x.user_id===sessionId),replies:P.filter(p=>p.reply_kind===kind&&p.reply_id===id).length};}
function actionsHTML(kind,id){const s=stats(kind,id),n=x=>x?`<span>${x}</span>`:"<span></span>";
  return `<div class="acts" data-kind="${kind}" data-id="${esc(id)}">
   <button class="act" data-act="reply" aria-label="${esc(t("reply"))}">${IC.reply}${n(s.replies)}</button>
   <button class="act ${s.reposted?"on":""}" data-act="repost" aria-label="${esc(t("repost"))}">${IC.repost}${n(s.reposts)}</button>
   <button class="act ${s.liked?"on liked":""}" data-act="like" aria-label="${esc(t("like"))}">${IC.like}${n(s.likes)}</button>
   <button class="act" data-act="share" aria-label="${esc(t("share"))}">${IC.share}<span></span></button></div>`;}
function refreshActs(kind,id){$$(`.acts[data-kind="${kind}"]`).filter(el=>el.dataset.id===id).forEach(el=>el.outerHTML=actionsHTML(kind,id));}
function postImgs(imgs){const a=(imgs||[]).filter(x=>typeof x!=="string"||imgOk(x)).slice(0,4);if(!a.length)return "";
  return `<div class="pimgs n${a.length}">${a.map(x=>typeof x==="string"?`<img src="${esc(x)}" alt="" loading="lazy">`:`<div class="svgimg">${coverSVG(x.seed||1)}</div>`).join("")}</div>`;}
function quoteEmbed(kind,id){
  if(kind==="article"){const a=published().find(x=>x.id===id);if(!a)return `<div class="qembed muted">${esc(t("unavailable"))}</div>`;const u=getUser(a.author)||{};
    return `<div class="qembed art" data-go="${esc(a.id)}"><div class="cover">${coverHTML(a)}</div><div><div class="label">${esc(catName(a.cat))}</div><div class="qt">${esc(a.title)}</div><div class="qm">${esc(u.name||"")} · ${readMin(a)} ${esc(t("min_read"))}</div></div></div>`;}
  const p=getPost(id);if(!p)return `<div class="qembed muted">${esc(t("unavailable"))}</div>`;const u=getUser(p.author)||{name:"Member",seed:1};
  return `<div class="qembed" data-go="post-${esc(p.id)}"><div class="qh"><span class="portrait">${portrait(u)}</span><span class="nm">${esc(u.name)}</span><span class="tm">· ${esc(fmtRel(p.created_at))}</span></div>
   ${p.body?`<div class="qb">${linkify(p.body.length>280?p.body.slice(0,280)+"…":p.body)}</div>`:""}${postImgs(p.images)}</div>`;}
function postHTML(p,o){o=o||{};const u=getUser(p.author)||{name:"Member",seed:1,id:""};const mine=sessionId&&(sessionId===p.author||isAdmin());
  let ctx="";if(o.ctx&&p.reply_kind){const tgt=p.reply_kind==="post"?getPost(p.reply_id):published().find(a=>a.id===p.reply_id);
    const tn=tgt?(p.reply_kind==="post"?(getUser(tgt.author)||{}).name:tgt.title):"";if(tn)ctx=`<div class="ctx" data-go="${p.reply_kind==="post"?"post-"+esc(p.reply_id):esc(p.reply_id)}">${esc(t("replying_to").replace("{n}",tn))}</div>`;}
  return `<article class="post ${o.main?"main":""}">${o.by?`<div class="rp-by">${IC.repost}${esc(t("reposted").replace("{n}",o.by))}</div>`:""}
   <div class="post-row"><a class="portrait" href="#member-${esc(u.id)}">${portrait(u)}</a><div class="post-main">
   <div class="post-head"><a class="nm" href="#member-${esc(u.id)}">${esc(u.name)}</a><span class="biz">${esc(u.business||"")}</span><span class="tm">· ${esc(fmtRel(p.created_at))}</span>
    ${mine?`<button class="del-post" data-delpost="${esc(p.id)}" aria-label="${esc(t("del"))}">×</button>`:""}</div>${ctx}
   ${p.body?`<div class="pbody" data-go="post-${esc(p.id)}">${linkify(p.body)}</div>`:""}${postImgs(p.images)}
   ${p.quote_id?quoteEmbed(p.quote_kind,p.quote_id):""}${actionsHTML("post",p.id)}</div></div></article>`;}
function articleFeedHTML(a,o){o=o||{};const u=getUser(a.author)||{name:"",seed:1,id:""};
  return `<article class="post">${o.by?`<div class="rp-by">${IC.repost}${esc(t("reposted").replace("{n}",o.by))}</div>`:""}
   <div class="post-row"><a class="portrait" href="#member-${esc(u.id)}">${portrait(u)}</a><div class="post-main">
   <div class="post-head"><a class="nm" href="#member-${esc(u.id)}">${esc(u.name)}</a><span class="biz">${esc(t("published_article"))}</span><span class="tm">· ${esc(fmtRel(a.updated&&a.status==="published"&&a.updated.slice(0,10)===a.date?a.updated:a.date+"T02:00:00.000Z"))}</span></div>
   <div class="art-embed" data-go="${esc(a.id)}"><div class="cover">${coverHTML(a)}</div><div class="ae-body"><div class="label">${esc(catName(a.cat))}</div><h3>${esc(a.title)}</h3>
    <p>${esc(a.subtitle||a.excerpt||"")}</p><div class="qm">${readMin(a)} ${esc(t("min_read"))} · ${a.lang==="id"?"ID":"EN"}</div></div></div>
   ${actionsHTML("article",a.id)}</div></div></article>`;}
const artTime=a=>(a.updated&&a.updated.slice(0,10)===a.date)?a.updated:a.date+"T02:00:00.000Z";
function feedEntries(tab){const out=[];const U=users();
  if(tab!=="articles")allPosts().filter(p=>!p.reply_kind).forEach(p=>out.push({t:p.created_at,html:()=>postHTML(p)}));
  if(tab!=="notes")published().forEach(a=>out.push({t:artTime(a),html:()=>articleFeedHTML(a)}));
  allReposts().forEach(r=>{const by=(U[r.user_id]||{}).name;if(!by)return;
    if(r.kind==="post"&&tab!=="articles"){const p=getPost(r.target_id);if(p)out.push({t:r.created_at,html:()=>postHTML(p,{by})});}
    if(r.kind==="article"&&tab!=="notes"){const a=published().find(x=>x.id===r.target_id);if(a)out.push({t:r.created_at,html:()=>articleFeedHTML(a,{by})});}});
  return out.sort((a,b)=>String(b.t).localeCompare(String(a.t)));}
function composerHTML(mode,ph,extra){
  if(!me())return `<div class="composer-gate"><p class="muted">${esc(t("signin_to_post"))}</p><div class="btn-row">${btn(esc(t("create_free")),"#signup","solid")}${btn(esc(t("signin")),"#signin")}</div></div>`;
  return `<form class="composer ${mode}"><span class="portrait">${portrait(me())}</span><div class="cmp-main"><textarea rows="${mode==="feed"?2:1}" maxlength="1000" placeholder="${esc(ph)}"></textarea>
   <div class="cmp-imgs"></div>${extra||""}<div class="cmp-bar"><button type="button" class="cmp-photo" aria-label="${esc(t("add_photos"))}">${TB_ICONS.img}<span>${esc(t("add_photos"))}</span></button>
   <span class="cmp-count"></span><button class="small-btn solid cmp-post">${esc(t("post_btn"))}</button></div></div></form>`;}
function wireComposer(form,ctx){if(!form)return;const ta=form.querySelector("textarea"),box=form.querySelector(".cmp-imgs"),cnt=form.querySelector(".cmp-count");let imgs=[];
  const fit=()=>{ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";const n=ta.value.length;cnt.textContent=n>800?(1000-n):"";};ta.addEventListener("input",fit);
  const draw=()=>{box.innerHTML=imgs.map((d,i)=>`<div class="thumb"><img src="${d}" alt=""><button type="button" data-rm="${i}" aria-label="remove">×</button></div>`).join("");};
  box.onclick=e=>{const b=e.target.closest("[data-rm]");if(b){imgs.splice(+b.dataset.rm,1);draw();}};
  form.querySelector(".cmp-photo").onclick=async()=>{if(imgs.length>=4){toast(t("max_photos"));return;}const ds=await pickImages(4-imgs.length);imgs=imgs.concat(ds).slice(0,4);draw();};
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();form.requestSubmit();}});
  form.onsubmit=async e=>{e.preventDefault();const body=ta.value.trim();if(!body&&!imgs.length&&!ctx.quote_id)return;if(body.length>1000){toast(t("too_long_post"));return;}
    const pb=form.querySelector(".cmp-post");busy(pb,true);const urls=[];
    for(const d of imgs){const u=await DB.uploadImage(d,"post");if(u)urls.push(u);}
    const p=await DB.createPost({id:"p"+Date.now().toString(36)+rand(),author:sessionId,body,images:urls,quote_kind:ctx.quote_kind||null,quote_id:ctx.quote_id||null,
      reply_kind:ctx.reply_kind||null,reply_id:ctx.reply_id||null,created_at:new Date().toISOString()});
    busy(pb,false);if(!p)return;ta.value="";imgs=[];draw();fit();toast(t("posted"));if(ctx.onDone)ctx.onDone(p);};}
function openQuote(kind,id){const bg=$("#modalBg");$("#modal").className="modal card wide";
  $("#modal").innerHTML=`<div class="label" style="margin-bottom:12px">${esc(t("quote"))}</div>${composerHTML("quote",t("quote_ph"),quoteEmbed(kind,id))}<div class="btn-row"><button type="button" class="small-btn" data-r="0">${esc(t("cancel"))}</button></div>`;
  bg.classList.add("open");const close=()=>{bg.classList.remove("open");$("#modal").className="modal card";};
  bg.onclick=e=>{if(e.target===bg||e.target.closest("[data-r]"))close();};
  wireComposer($("#modal .composer"),{quote_kind:kind,quote_id:id,onDone:()=>{close();if(/^#?(feed)?$/.test(location.hash)||location.hash==="#feed")route();else refreshActs(kind,id);}});
  setTimeout(()=>{const x=$("#modal textarea");if(x)x.focus();},60);}
function sheet(title,opts){return new Promise(res=>{const bg=$("#modalBg");
  $("#modal").innerHTML=`${title?`<h3>${esc(title)}</h3>`:""}<div class="sheet-opts">${opts.map(o=>`<button class="sheet-opt" data-v="${esc(o.v)}">${o.icon||""}${esc(o.label)}</button>`).join("")}</div>
   <div class="btn-row"><button class="small-btn" data-v="">${esc(t("cancel"))}</button></div>`;
  bg.classList.add("open");bg.onclick=e=>{const b=e.target.closest("[data-v]");if(b||e.target===bg){bg.classList.remove("open");res(b?b.dataset.v:"");}};});}
function needMember(){if(me())return true;afterLoginTarget=(location.hash||"#feed").slice(1);toast(t("signin_to_post"),3500);go("signup");return false;}
document.addEventListener("click",async e=>{
  const dp=e.target.closest("[data-delpost]");
  if(dp){e.preventDefault();e.stopPropagation();if(await confirmBox(t("delete_post"),"",t("del"))){if(await DB.deletePost(dp.dataset.delpost)){toast(t("post_deleted"));route();}}return;}
  const b=e.target.closest("[data-act]");
  if(b){const box=b.closest(".acts");if(!box)return;e.preventDefault();e.stopPropagation();const kind=box.dataset.kind,id=box.dataset.id,act=b.dataset.act;
    if(act==="share"){const url=location.href.split("#")[0]+"#"+(kind==="post"?"post-"+id:id);try{await navigator.clipboard.writeText(url);toast(t("copied"));}catch(err){toast(url,5000);}return;}
    if(act==="reply"){if(kind==="post"){if(location.hash==="#post-"+id){const f=$(".composer.reply textarea");if(f)f.focus();else needMember();}else go("post-"+id);}
      else{if(location.hash==="#"+id){const d=$("#discussion");if(d)d.scrollIntoView({behavior:"smooth"});const f=$("#discussion textarea");if(f)setTimeout(()=>f.focus(),400);}else{pendingDiscussion=true;go(id);}}return;}
    if(!needMember())return;
    if(act==="like"){const r=await DB.toggle("likes",kind,id);if(r!==null)refreshActs(kind,id);return;}
    if(act==="repost"){const s=stats(kind,id);const v=await sheet("",[{v:"repost",label:s.reposted?t("undo_repost"):t("repost"),icon:IC.repost},{v:"quote",label:t("quote"),icon:TB_ICONS.quote}]);
      if(v==="repost"){const r=await DB.toggle("reposts",kind,id);if(r!==null){refreshActs(kind,id);if(r)toast(t("repost")+" ✓");}}
      if(v==="quote")openQuote(kind,id);return;}
    return;}
  if(e.target.closest("a,button,input,textarea,select,[contenteditable]"))return;
  const im=e.target.closest(".pimgs img, article.prose img");
  if(im){const bg=$("#modalBg");$("#modal").className="modal lightbox";$("#modal").innerHTML=`<img src="${esc(im.getAttribute("src"))}" alt="">`;bg.classList.add("open");
    bg.onclick=()=>{bg.classList.remove("open");$("#modal").className="modal card";};return;}
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);}
});
let feedTab="all", pendingDiscussion=false;
function viewFeed(){return `<div class="wrap narrow fade feed-wrap"><div class="page-head" style="padding-bottom:14px"><div class="label">${esc(t("feed_lbl"))}</div><h1 class="h-display" style="margin-top:10px">${t("feed_h")}</h1></div>
  ${composerHTML("feed",t("compose_ph"))}
  <div class="chips feed-tabs" id="feedTabs">${[["all","tab_all"],["notes","tab_notes"],["articles","tab_articles"]].map(([k,l])=>`<button class="chip ${feedTab===k?"on":""}" data-tab="${k}">${esc(t(l))}</button>`).join("")}</div>
  <div id="feedList" class="feed-list"></div><div style="height:60px"></div></div>`;}
function renderFeed(){const items=feedEntries(feedTab).slice(0,150);$("#feedList").innerHTML=items.length?items.map(x=>x.html()).join(""):`<div class="empty">${esc(t("no_posts"))}</div>`;}
function afterFeed(){renderFeed();wireComposer($(".feed-wrap .composer"),{onDone:()=>{feedTab=feedTab==="articles"?"all":feedTab;renderFeed();}});
  $("#feedTabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(!b)return;feedTab=b.dataset.tab;$$("#feedTabs .chip").forEach(x=>x.classList.toggle("on",x===b));renderFeed();};}
function viewPost(p){const replies=allPosts().filter(r=>r.reply_kind==="post"&&r.reply_id===p.id).sort((a,b)=>a.created_at.localeCompare(b.created_at));
  let parent="";if(p.reply_kind==="post"){const pp=getPost(p.reply_id);if(pp)parent=`<div class="parent">${postHTML(pp,{ctx:true})}</div>`;}
  else if(p.reply_kind==="article"){parent=`<div style="margin:14px 0">${quoteEmbed("article",p.reply_id)}</div>`;}
  return `<div class="wrap narrow fade feed-wrap"><div style="padding-top:30px"><a class="link-u" href="#feed">← ${esc(t("back_feed"))}</a></div>
   <div class="thread">${parent}${postHTML(p,{main:true})}</div>${composerHTML("reply",t("reply_ph"))}
   <div class="feed-list">${replies.map(r=>postHTML(r)).join("")}</div><div style="height:60px"></div></div>`;}
function afterPost(p){wireComposer($(".feed-wrap .composer.reply"),{reply_kind:"post",reply_id:p.id,onDone:()=>route()});}


/* ================= admin dashboard ================= */
let adminTab="overview",adminEmails=null,adminQ="",adminArtF="all";
const badge=(txt,cls)=>`<span class="badge ${cls||""}">${esc(txt)}</span>`;
function adminGate(){return `<div class="wrap fade"><div class="card auth-card" style="text-align:center"><div class="label">Admin</div><h1 class="h-display"><em>Admins</em> <strong>only</strong></h1>
  <p class="muted">This page is only for The Buz Owners admins.</p><div class="btn-row" style="justify-content:center;margin-top:18px">${me()?btn("Back home","#home","solid"):btn(esc(t("signin")),"#signin","solid")}</div></div></div>`;}
function viewAdmin(){if(!isAdmin())return adminGate();
  const tabs=[["overview","Overview"],["members","Members"],["articles","Articles"],["feed","Feed & comments"],["rooms","Expert rooms"],["form","Member data"],["settings","Site settings"]];
  return `<div class="wrap fade admin" style="padding-bottom:80px"><div class="page-head" style="padding-bottom:10px"><div class="label">Admin</div><h1 class="h-display" style="margin-top:10px"><em>Admin</em> <strong>dashboard</strong></h1></div>
   <div class="chips" id="admTabs">${tabs.map(([k,l])=>`<button class="chip ${adminTab===k?"on":""}" data-tab="${k}">${l}</button>`).join("")}</div>
   <div id="admBody" class="adm-body"></div></div>`;}
async function afterAdmin(){if(!isAdmin())return;
  $("#admTabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(!b)return;adminTab=b.dataset.tab;adminQ="";$$("#admTabs .chip").forEach(x=>x.classList.toggle("on",x===b));renderAdmin();};
  renderAdmin();
  if(adminEmails===null){const r=await DB.adminCall("list_users");if(r&&r.users){adminEmails={};r.users.forEach(u=>adminEmails[u.id]=u);}else{adminEmails={};if(r&&r.error)console.warn(r.error);}
    if(adminTab==="members"||adminTab==="overview")renderAdmin();}}
function renderAdmin(){const box=$("#admBody");if(!box)return;
  const fn={overview:admOverview,members:admMembers,articles:admArticles,feed:admFeed,rooms:admRooms,form:admFormTab,settings:admSettings}[adminTab]||admOverview;fn(box);}
function admSearch(ph){return `<form class="search adm-search" onsubmit="return false"><input id="admQ" type="search" placeholder="${esc(ph)}" value="${esc(adminQ)}"><span class="arr">${ARROW}</span></form>`;}
function wireSearch(cb){const i=$("#admQ");if(i)i.oninput=e=>{adminQ=e.target.value;cb();};}
function admOverview(box){const U=Object.values(allUsersRaw()),A=allArticles(),P=allPostsRaw();const wk=Date.now()-7*864e5;
  const newU=U.filter(u=>u.created_at&&new Date(u.created_at).getTime()>wk).length;
  const stat=(n,l,h)=>`<a class="adm-stat" ${h?`href="#admin" data-jump="${h}"`:""}><div class="n">${n}</div><div class="l">${l}</div></a>`;
  box.innerHTML=`<div class="adm-stats">${stat(U.length,"Members","members")}${stat(newU,"New this week","members")}${stat(U.filter(u=>u.is_admin).length,"Admins","members")}${stat(U.filter(u=>u.banned).length,"Suspended","members")}
    ${stat(A.filter(a=>a.status==="published").length,"Published articles","articles")}${stat(A.filter(a=>a.status!=="published").length,"Drafts","articles")}${stat(P.filter(p=>!p.reply_kind).length,"Feed posts","feed")}${stat(P.filter(p=>p.reply_kind).length,"Replies & comments","feed")}</div>
   <div class="two" style="margin-top:26px;align-items:start"><div><div class="label" style="margin-bottom:6px">Newest members</div><div class="mini-list">${U.slice().sort((a,b)=>String(b.created_at||"").localeCompare(String(a.created_at||""))).slice(0,6).map(u=>admUserRow(u,true)).join("")}</div></div>
   <div><div class="label" style="margin-bottom:6px">Latest articles</div><div class="mini-list">${A.slice().sort((a,b)=>String(b.updated||b.date).localeCompare(String(a.updated||a.date))).slice(0,6).map(admArtRow).join("")}</div></div></div>`;
  box.onclick=e=>{const j=e.target.closest("[data-jump]");if(j){e.preventDefault();adminTab=j.dataset.jump;$$("#admTabs .chip").forEach(x=>x.classList.toggle("on",x.dataset.tab===adminTab));renderAdmin();return;}admRowClick(e);};}
function admUserRow(u,compact){const em=adminEmails&&adminEmails[u.id];
  return `<div class="mini adm-row"><span class="portrait" style="width:46px;height:46px">${portrait(u)}</span><div style="min-width:0;flex:1">
   <div class="t">${esc(u.name||"—")} ${u.is_admin?badge("Admin","gold"):""}${u.banned?badge("Suspended","red"):""}${em&&em.confirmed===false?badge("Unconfirmed",""):""}</div>
   <div class="s">${esc([u.business,locText(u),em&&em.email,u.created_at?("joined "+fmtDate(String(u.created_at).slice(0,10))):""].filter(Boolean).join(" · "))}</div></div>
   <div class="acts">${LIVE&&!cache.profiles[u.id]?badge("Example",""):`<button class="small-btn" data-uact="${esc(u.id)}">Manage</button>`}</div></div>`;}
function admMembers(box){const q=adminQ.toLowerCase();const U=Object.values(allUsersRaw()).filter(u=>!q||[u.name,u.business,u.city,u.area,adminEmails&&adminEmails[u.id]&&adminEmails[u.id].email].join(" ").toLowerCase().includes(q))
   .sort((a,b)=>(b.is_admin-a.is_admin)||String(a.name).localeCompare(b.name));
  box.innerHTML=`<div class="adm-bar">${admSearch("Search members, businesses, emails…")}<button class="btn solid" id="admAdd">Add member<span class="arr">${ARROW}</span></button></div>
   ${adminEmails===null?`<p class="muted" style="font-size:13px">Loading emails…</p>`:""}<div class="mini-list">${U.map(u=>admUserRow(u)).join("")||`<div class="empty">No members found.</div>`}</div>`;
  wireSearch(()=>{const l=box.querySelector(".mini-list");const st=adminQ;admMembers(box);const i=$("#admQ");i.focus();i.setSelectionRange(st.length,st.length);});
  $("#admAdd").onclick=admAddMember;box.onclick=admRowClick;}
async function admRowClick(e){const ub=e.target.closest("[data-uact]");if(ub){admUserMenu(ub.dataset.uact);return;}
  const ab=e.target.closest("[data-aact]");if(ab){admArtMenu(ab.dataset.aact);return;}
  const pb=e.target.closest("[data-pdel]");if(pb){if(await confirmBox("Delete this post?","It will be removed for everyone.","Delete")){if(await DB.deletePost(pb.dataset.pdel)){toast("Deleted");renderAdmin();}}return;}
  const mb=e.target.closest("[data-mdel]");if(mb){if(await confirmBox("Delete this message?","It will be removed from the room.","Delete")){if(await DB.deleteMessage(mb.dataset.mdel)){toast("Deleted");renderAdmin();}}return;}}
async function admUserMenu(id){const u=allUsersRaw()[id];if(!u)return;const self=id===sessionId;const em=adminEmails&&adminEmails[id];
  const opts=[{v:"view",label:"View profile"},{v:"edit",label:"Edit profile"}];
  if(!self)opts.push({v:"ban",label:u.banned?"Unsuspend (restore account)":"Suspend (hide & block posting)"},{v:"admin",label:u.is_admin?"Remove admin rights":"Make admin"});
  if(em&&em.email&&LIVE)opts.push({v:"reset",label:"Email a password-reset link"});
  opts.push({v:"pw",label:"Set a new password"});
  if(em&&em.confirmed===false)opts.push({v:"confirm",label:"Confirm their email manually"});
  if(!self)opts.push({v:"delete",label:"Delete account permanently"});
  const v=await sheet(u.name,opts);
  if(v==="view")go("member-"+id);
  if(v==="edit")admEditMember(u);
  if(v==="ban"){if(await DB.adminUpdateProfile(id,{banned:!u.banned})){toast(u.banned?"Account restored":"Account suspended");renderAdmin();}}
  if(v==="admin"){if(!u.is_admin||await confirmBox("Remove admin rights?",u.name+" will no longer see this dashboard.","Remove")){if(await DB.setAdmin(id,!u.is_admin)){toast(u.is_admin?"Admin removed":"Now an admin");renderAdmin();}}}
  if(v==="reset"){const r=await DB.resetPassword(em.email);toast(r.error?r.error:"Reset email sent to "+em.email,4000);}
  if(v==="pw"){const pw=await inputDialog("Set new password","At least 6 characters");if(!pw)return;if(pw.length<6){toast(t("pw_hint"));return;}const r=await DB.adminCall("set_password",{id,password:pw});toast(r.error||"Password updated — tell the member their new password",4500);}
  if(v==="confirm"){const r=await DB.adminCall("confirm_user",{id});if(!r.error){em.confirmed=true;renderAdmin();}toast(r.error||"Email confirmed");}
  if(v==="delete"){if(await confirmBox("Delete "+u.name+"?","Their account, profile, articles, posts and messages will be deleted permanently. This can't be undone.","Delete forever")){
    const r=await DB.adminCall("delete_user",{id});if(r.error){toast(r.error,5000);return;}if(LIVE)await DB.reload();toast("Account deleted");renderAdmin();}}}
function admModal(title,inner,onSave,saveLabel){return new Promise(res=>{const bg=$("#modalBg");$("#modal").className="modal card wide";
  $("#modal").innerHTML=`<div class="label">Admin</div><h3 style="margin:6px 0 14px">${esc(title)}</h3><form id="admF" class="form">${inner}<div class="err" id="admErr"></div>
   <div class="btn-row"><button type="button" class="small-btn" data-x="1">Cancel</button><button class="btn solid">${esc(saveLabel||"Save")}<span class="arr">${ARROW}</span></button></div></form>`;
  bg.classList.add("open");const close=()=>{bg.classList.remove("open");$("#modal").className="modal card";res();};
  bg.onclick=e=>{if(e.target===bg||e.target.closest("[data-x]"))close();};
  const pk=$("#admF .dv-pick");if(pk)wirePicker(pk);
  $("#admF").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector(".btn");busy(b,true);const err=await onSave(new FormData(e.target),e.target);busy(b,false);if(err){$("#admErr").textContent=err;return;}close();};});}
function admEditMember(u){const fld=(n,l,v,ph)=>`<div class="field"><label>${l}</label><input name="${n}" value="${esc(v||"")}" placeholder="${esc(ph||"")}"></div>`;
  admModal("Edit "+u.name,`${fld("name","Full name",u.name)}<div class="ed-grid">${fld("role","Role",u.role)}${fld("business","Business",u.business)}</div>
   <div class="ed-grid">${fld("city","City",u.city)}${fld("area","Area",u.area)}</div>${fld("ig","Instagram",u.ig)}${fld("services","How I can help",u.services)}
   <div class="field"><label>Fields of expertise</label>${divPicker(u.divisions||[],u.other_field)}</div><div class="field"><label>Bio</label><textarea name="bio">${esc(u.bio||"")}</textarea></div>`,
   async(f,form)=>{const g=k=>String(f.get(k)||"").trim();if(!g("name"))return "Name is required.";
     const ok=await DB.adminUpdateProfile(u.id,{name:g("name"),role:g("role"),business:g("business"),city:normLoc(g("city")),area:normLoc(g("area")),ig:g("ig").replace(/^@/,""),services:g("services"),bio:g("bio"),divisions:pickedDivs(form.querySelector(".dv-pick")),other_field:g("other_field")});
     if(!ok)return "Couldn't save.";toast("Profile updated");renderAdmin();});}
function admAddMember(){admModal("Add a member",`<div class="field"><label>Full name *</label><input name="name" required></div><div class="field"><label>Business *</label><input name="business" required></div>
   <div class="field"><label>Email *</label><input name="email" type="email" required autocapitalize="none"></div><div class="field"><label>Temporary password *</label><input name="password" minlength="6" required></div>
   <p class="hint">The account is created already confirmed. Share the email and temporary password with the member; they can change it under Forgot password.</p>`,
   async f=>{const g=k=>String(f.get(k)||"").trim();if(g("password").length<6)return t("pw_hint");
     const r=await DB.adminCall("create_user",{name:g("name"),business:g("business"),email:g("email").toLowerCase(),password:g("password")});if(r.error)return r.error;
     if(LIVE)await DB.reload();adminEmails=null;toast("Member added");afterAdmin();},"Create account");}
function admArtRow(a){const u=allUsersRaw()[a.author]||{name:"(deleted)"};
  return `<div class="mini adm-row"><a href="#${a.status==="published"?esc(a.id):"edit-"+esc(a.id)}" class="cover">${coverHTML(a)}</a><div style="min-width:0;flex:1">
   <div class="t">${esc(a.title||t("untitled"))} ${a.featured?badge("Featured","gold"):""}${a.status!=="published"?badge("Draft",""):""}</div>
   <div class="s">${esc(u.name)} · ${esc(catName(a.cat))} · ${esc(fmtDate(a.date))}</div></div><div class="acts"><button class="small-btn" data-aact="${esc(a.id)}">Manage</button></div></div>`;}
function admArticles(box){const q=adminQ.toLowerCase();const U=allUsersRaw();
  const A=allArticles().filter(a=>(adminArtF==="all"||(adminArtF==="published"?a.status==="published":a.status!=="published"))&&(!q||[a.title,a.excerpt,(U[a.author]||{}).name].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>String(b.updated||b.date).localeCompare(String(a.updated||a.date)));
  box.innerHTML=`<div class="adm-bar">${admSearch("Search articles or authors…")}</div><div class="chips" id="admArtF" style="padding-top:4px">${[["all","All"],["published","Published"],["drafts","Drafts"]].map(([k,l])=>`<button class="chip sm ${adminArtF===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>
   <div class="mini-list">${A.map(admArtRow).join("")||`<div class="empty">No articles.</div>`}</div>`;
  wireSearch(()=>{const st=adminQ;admArticles(box);const i=$("#admQ");i.focus();i.setSelectionRange(st.length,st.length);});
  $("#admArtF").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;adminArtF=b.dataset.f;admArticles(box);};box.onclick=admRowClick;}
async function admArtMenu(id){const a=allArticles().find(x=>x.id===id);if(!a)return;const pub=a.status==="published";
  const v=await sheet(a.title,[{v:"view",label:pub?"View article":"Preview / edit draft"},{v:"edit",label:"Edit article"},
    ...(pub?[{v:"feat",label:a.featured?"Remove from featured":"Make the featured story"}]:[]),{v:"status",label:pub?"Unpublish (back to draft)":"Publish now"},{v:"del",label:"Delete article"}]);
  if(v==="view")go(pub?a.id:"edit-"+a.id);
  if(v==="edit"){draft=null;go("edit-"+a.id);}
  if(v==="feat"){if(await DB.setFeatured(a.featured?"":a.id)){toast(a.featured?"Removed from featured":"Now featured on the home page");renderAdmin();}}
  if(v==="status"){if(await DB.setArticleStatus(a,pub?"draft":"published")){toast(pub?"Unpublished":"Published");renderAdmin();}}
  if(v==="del"){if(await confirmBox("Delete “"+a.title+"”?","This can't be undone.","Delete")){if(await DB.deleteArticle(a.id)){toast("Article deleted");renderAdmin();}}}}
function admFeed(box){const q=adminQ.toLowerCase();const U=allUsersRaw();
  const P=allPostsRaw().filter(p=>!q||[p.body,(U[p.author]||{}).name].join(" ").toLowerCase().includes(q)).sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,200);
  const kind=p=>p.reply_kind==="article"?"Comment":p.reply_kind?"Reply":p.quote_id?"Quote":"Post";
  box.innerHTML=`<div class="adm-bar">${admSearch("Search posts, replies, comments…")}</div><div class="mini-list">${P.map(p=>{const u=U[p.author]||{name:"(deleted)"};
    return `<div class="mini adm-row"><span class="portrait" style="width:40px;height:40px">${portrait(u)}</span><div style="min-width:0;flex:1"><div class="s">${esc(kind(p))} · ${esc(u.name)} · ${esc(fmtRel(p.created_at))}</div>
     <div class="snip-2">${esc(p.body||"(photo)")}</div></div><div class="acts"><a class="small-btn" href="#${p.reply_kind==="article"?esc(p.reply_id):"post-"+esc(p.reply_kind==="post"?p.reply_id:p.id)}">View</a><button class="small-btn danger" data-pdel="${esc(p.id)}">Delete</button></div></div>`;}).join("")||`<div class="empty">Nothing yet.</div>`}</div>`;
  wireSearch(()=>{const st=adminQ;admFeed(box);const i=$("#admQ");i.focus();i.setSelectionRange(st.length,st.length);});box.onclick=admRowClick;}
async function admRooms(box){box.innerHTML=`<p class="muted">${esc(t("loading"))}</p>`;const all=(await DB.recentMessages()).filter(m=>String(m.room).startsWith("div:")).sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,200);

  $("#admSet").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const b=e.target.querySelector(".btn");busy(b,true);

    busy(b,false);if(ok){toast("Settings saved");try{sessionStorage.removeItem("tbo_ann_closed");}catch(err){}renderAnnouncement();}};}
function renderAnnouncement(){let el=$("#announce");const S=settingsAll();const txt=(S["public_announcement_"+lang]||S.public_announcement_en||"").trim();
  let closed="";try{closed=sessionStorage.getItem("tbo_ann_closed")||"";}catch(e){}
  if(!txt||closed===txt){if(el)el.remove();return;}
  if(!el){el=document.createElement("div");el.id="announce";el.className="announce";$("#hdr").after(el);}
  el.innerHTML=`<div class="wrap ann-in"><span>${linkify(txt)}</span><button aria-label="Close" id="annX">×</button></div>`;
  $("#annX").onclick=()=>{try{sessionStorage.setItem("tbo_ann_closed",txt);}catch(e){}el.remove();};}

function respCSV(ids){const U=allUsersRaw(),F=formDef();const em=adminEmails||{};
